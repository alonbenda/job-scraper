<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Scraper Dashboard</title>
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #1a1a1a; --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 24px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, #2563eb, #7c3aed); color: white;
    padding: 20px 24px; border-radius: 12px; margin-bottom: 16px;
  }
  header h1 { margin: 0; font-size: 22px; }
  header .sub { opacity: .85; font-size: 12px; margin-top: 4px; }
  header button {
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.4); color: white;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  header button:hover { background: rgba(255,255,255,.25); }
  .controls { display: flex; align-items: center; gap: 12px; }
  .controls label { font-size: 12px; opacity: .9; display: flex; align-items: center; gap: 4px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 16px;
  }

  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 120px; border-radius: 8px; padding: 12px 14px; cursor: pointer;
    border: 1px solid var(--border);
  }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .stat.ok { background: #f0fdf4; }
  .stat.error { background: #fef2f2; }
  .stat.empty { background: #fefce8; }
  .stat.discovered { background: #eff6ff; }
  .site-list { margin-top: 10px; font-size: 12px; color: var(--muted); display: none; }
  .site-list.open { display: block; }
  .site-list span { display: inline-block; background: #f1f5f9; border-radius: 4px; padding: 2px 6px; margin: 2px; }
  .site-list span.discovered-tag { opacity: .6; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .filters input, .filters select {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
  }
  .filters input[type="text"] { flex: 1; min-width: 180px; }

  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); background: #f8fafc; font-size: 12px; color: var(--muted); }
  td { padding: 8px 12px; border-bottom: 1px solid #eee; vertical-align: top; }
  tr.new-row { background: #fffbeb; }
  .new-badge {
    background: #fde68a; color: #78350f; font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 10px; margin-right: 6px;
  }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  .kw { background: #dcfce7; color: #166534; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-right: 3px; display: inline-block; }
  .kw.field { background: #e0f2fe; color: #1e40af; }
  .cat-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-right: 6px; }
  .cat-badge.student { background: #dcfce7; color: #166534; }
  .cat-badge.junior { background: #eff6ff; color: #1e40af; }
  a.apply { color: #2563eb; text-decoration: none; font-size: 13px; }
  a.apply.visited { color: #16a34a; font-weight: 600; }
  .empty-msg { text-align: center; color: var(--muted); padding: 30px; }

  @media (max-width: 640px) {
    body { padding: 12px; }
    header { flex-wrap: wrap; gap: 12px; }
    table, thead, tbody, th, tr, td { display: block; }
    thead tr { position: absolute; top: -9999px; left: -9999px; }
    table { border: none; }
    tbody tr {
      border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px;
      padding: 8px 10px; background: var(--card);
    }
    tbody tr.new-row { background: #fffbeb; }
    tbody td { border: none; padding: 6px 4px; }
    tbody td::before {
      content: attr(data-label); display: block; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .02em; color: var(--muted); margin-bottom: 2px;
    }
    tbody td[data-label="Title"] { font-size: 15px; font-weight: 600; }
  }

  #loginScreen {
    max-width: 360px; margin: 80px auto; text-align: center;
  }
  #loginScreen h1 { font-size: 20px; margin-bottom: 20px; }
  #loginScreen input {
    width: 100%; padding: 10px 12px; margin-bottom: 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 14px;
  }
  #loginScreen button {
    width: 100%; padding: 10px; background: #2563eb; color: white; border: none;
    border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  #loginScreen button:hover { background: #1d4ed8; }
  #loginError { color: #991b1b; font-size: 13px; margin-top: 10px; min-height: 18px; }
  #dashboard { display: none; }
</style>
</head>
<body>

<div id="loginScreen" class="card">
  <h1>🔍 Job Scraper Dashboard</h1>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
    <button type="submit">Log in</button>
    <div id="loginError"></div>
  </form>
</div>

<div class="wrap" id="dashboard">
  <header>
    <div>
      <h1>🔍 Job Scraper Dashboard</h1>
      <div class="sub" id="lastRefreshed">Loading…</div>
    </div>
    <div class="controls">
      <label><input type="checkbox" id="autoRefresh" checked> Auto-refresh (60s)</label>
      <button id="refreshBtn">Refresh now</button>
      <button id="logoutBtn">Log out</button>
    </div>
  </header>

  <div class="card">
    <div class="stats" id="statsRow"></div>
    <div class="site-list" id="siteList"></div>
  </div>

  <div class="card">
    <div class="filters">
      <input type="text" id="searchBox" placeholder="Search title or company…">
      <select id="categoryFilter">
        <option value="all">All categories</option>
        <option value="student">🎓 Student / Intern</option>
        <option value="junior">🚀 Junior / Entry-level</option>
      </select>
      <select id="timeFilter">
        <option value="all">Any time</option>
        <option value="1">Today</option>
        <option value="2">Last 2 days</option>
        <option value="7">Last 7 days</option>
      </select>
      <select id="sortBy">
        <option value="newest">Sort: Newest first</option>
        <option value="fit">Sort: CV Fit</option>
        <option value="company">Sort: Company A-Z</option>
      </select>
    </div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Job Title</th>
          <th>Company</th>
          <th>CV Fit</th>
          <th>Posted</th>
          <th>Keywords</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="jobsBody"></tbody>
    </table>
    <div class="empty-msg" id="emptyMsg" style="display:none;">No jobs match your filters.</div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Supabase config — SUPABASE_URL matches the project db.py already uses.
// SUPABASE_ANON_KEY is the public/anon key (Project Settings → API), safe to
// ship in client code by design — never put the secret/service key here.
// ---------------------------------------------------------------------------
const SUPABASE_URL = "https://bopkycnbkgqhycevjutn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvcGt5Y25ia2dxaHljZXZqdXRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NTg2NzUsImV4cCI6MjA5MTIzNDY3NX0.i571cyS3XqQ5W7M7nZ6AA7Xpemt4AExwIaV9g0ccHAo";

const NEW_BADGE_GRACE_MS = 2 * 60 * 1000; // jobs stay NEW for ~2 min after being found (see markViewed)

let allJobs = [];
let lastViewedAt = null;
let sites = [];

// -- auth --

function getTokens() {
  return {
    access: localStorage.getItem('sb_access_token'),
    refresh: localStorage.getItem('sb_refresh_token'),
  };
}
function setTokens(access, refresh) {
  localStorage.setItem('sb_access_token', access);
  localStorage.setItem('sb_refresh_token', refresh);
}
function clearTokens() {
  localStorage.removeItem('sb_access_token');
  localStorage.removeItem('sb_refresh_token');
}

function showLogin(message) {
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('loginError').textContent = message || '';
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
}

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

async function login(email, password) {
  const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  if (!resp.ok) throw new Error('Invalid email or password');
  const data = await resp.json();
  setTokens(data.access_token, data.refresh_token);
}

async function refreshSession() {
  const { refresh } = getTokens();
  if (!refresh) return false;
  try {
    const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refresh }),
    });
    if (!resp.ok) return false;
    const data = await resp.json();
    setTokens(data.access_token, data.refresh_token);
    return true;
  } catch {
    return false;
  }
}

async function supaFetch(path, options = {}) {
  const doFetch = (token) => fetch(`${SUPABASE_URL}${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...(options.headers || {}),
    },
  });

  let resp = await doFetch(getTokens().access);
  if (resp.status === 401) {
    const refreshed = await refreshSession();
    if (!refreshed) {
      clearTokens();
      showLogin('Session expired — please log in again.');
      throw new Error('Session expired');
    }
    resp = await doFetch(getTokens().access);
  }
  return resp;
}

// -- rendering (same logic as the local dashboard) --

function scoreBadge(score) {
  if (score === undefined || score === null || score < 0) {
    return '<span class="badge" style="background:#f3f4f6;color:#6b7280;">N/A</span>';
  }
  let color, bg;
  if (score >= 75) { color = '#166534'; bg = '#dcfce7'; }
  else if (score >= 50) { color = '#854d0e'; bg = '#fef9c3'; }
  else if (score >= 25) { color = '#9a3412'; bg = '#ffedd5'; }
  else { color = '#991b1b'; bg = '#fee2e2'; }
  return `<span class="badge" style="background:${bg};color:${color};">${score}%</span>`;
}

function categorize(job) {
  const roles = job.matched_roles || [];
  return roles.some(r => ['student', 'intern', 'internship'].includes(r)) ? 'student' : 'junior';
}

function isNew(job) {
  if (!lastViewedAt) return false;
  return new Date(job.first_seen) > new Date(lastViewedAt);
}

function renderStats() {
  const counts = { ok: 0, error: 0, empty: 0, discovered: 0 };
  sites.forEach(s => {
    if (s.source === 'discovered') counts.discovered++;
    else if (s.last_status === 'error') counts.error++;
    else if (s.last_status === 'empty') counts.empty++;
    else if (s.last_status === 'ok') counts.ok++;
  });
  const statsRow = document.getElementById('statsRow');
  statsRow.innerHTML = `
    <div class="stat ok" data-k="ok"><div class="n">${counts.ok}</div><div class="l">OK</div></div>
    <div class="stat error" data-k="error"><div class="n">${counts.error}</div><div class="l">Errors</div></div>
    <div class="stat empty" data-k="empty"><div class="n">${counts.empty}</div><div class="l">Empty (0 jobs)</div></div>
    <div class="stat discovered" data-k="discovered"><div class="n">${counts.discovered}</div><div class="l">Discovered (search)</div></div>
  `;
  statsRow.querySelectorAll('.stat').forEach(el => el.onclick = () => toggleSiteList(el.dataset.k));
}

function toggleSiteList(kind) {
  const listEl = document.getElementById('siteList');
  const isOpenSame = listEl.classList.contains('open') && listEl.dataset.kind === kind;
  if (isOpenSame) { listEl.classList.remove('open'); return; }

  let filtered;
  if (kind === 'discovered') filtered = sites.filter(s => s.source === 'discovered');
  else filtered = sites.filter(s => s.source !== 'discovered' && s.last_status === kind);

  listEl.dataset.kind = kind;
  listEl.innerHTML = filtered.length
    ? filtered.map(s => `<span class="${s.source === 'discovered' ? 'discovered-tag' : ''}">${s.name}</span>`).join('')
    : '<em>None</em>';
  listEl.classList.add('open');
}

function renderJobs() {
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const category = document.getElementById('categoryFilter').value;
  const sortBy = document.getElementById('sortBy').value;
  const timeRange = document.getElementById('timeFilter').value;
  const cutoff = timeRange === 'all' ? null : Date.now() - Number(timeRange) * 24 * 60 * 60 * 1000;

  let jobs = allJobs.filter(j => {
    if (search && !(`${j.title} ${j.company}`.toLowerCase().includes(search))) return false;
    if (category !== 'all' && categorize(j) !== category) return false;
    if (cutoff !== null && new Date(j.first_seen).getTime() < cutoff) return false;
    return true;
  });

  jobs = jobs.slice().sort((a, b) => {
    if (sortBy === 'fit') return (b.fit_score ?? -1) - (a.fit_score ?? -1);
    if (sortBy === 'company') return (a.company || '').localeCompare(b.company || '');
    return new Date(b.first_seen) - new Date(a.first_seen);
  });

  const body = document.getElementById('jobsBody');
  document.getElementById('emptyMsg').style.display = jobs.length ? 'none' : 'block';
  body.innerHTML = jobs.map(j => {
    const cat = categorize(j);
    const catLabel = cat === 'student' ? '🎓 Student' : '🚀 Junior';
    const roles = (j.matched_roles || []).map(k => `<span class="kw">${k}</span>`).join('');
    const fields = (j.matched_fields || []).map(k => `<span class="kw field">${k}</span>`).join('');
    const visited = !!j.clicked_at;
    const link = j.link
      ? `<a class="apply ${visited ? 'visited' : ''}" href="${j.link}" target="_blank" rel="noopener" data-job-id="${j.id}">${visited ? '✓ Visited' : 'Apply →'}</a>`
      : 'N/A';
    return `
      <tr class="${isNew(j) ? 'new-row' : ''}">
        <td data-label="Title">${isNew(j) ? '<span class="new-badge">NEW</span>' : ''}${j.title}</td>
        <td data-label="Company"><span class="cat-badge ${cat}">${catLabel}</span>${j.company || ''}</td>
        <td data-label="CV Fit">${scoreBadge(j.fit_score)}</td>
        <td data-label="Posted">${j.posted_date || '—'}</td>
        <td data-label="Keywords">${roles}${fields}</td>
        <td data-label="Link">${link}</td>
      </tr>`;
  }).join('');
  body.querySelectorAll('a.apply[data-job-id]').forEach(el => {
    el.onclick = () => markClicked(el.dataset.jobId);
  });
}

async function markClicked(jobId) {
  const job = allJobs.find(j => j.id === jobId);
  if (job && !job.clicked_at) {
    job.clicked_at = new Date().toISOString();
    renderJobs();
  }
  try {
    await supaFetch(`/rest/v1/jobs?id=eq.${jobId}`, {
      method: 'PATCH',
      body: JSON.stringify({ clicked_at: new Date().toISOString() }),
    });
  } catch {
    // best-effort — the link already opened via target="_blank" regardless
  }
}

// -- data loading (direct Supabase REST, same shape db.py's functions return) --

async function loadJobs() {
  const resp = await supaFetch('/rest/v1/jobs?select=*&order=first_seen.desc&limit=300');
  allJobs = await resp.json();
  const uvResp = await supaFetch('/rest/v1/ui_state?select=last_viewed_at&id=eq.1');
  const uvRows = await uvResp.json();
  lastViewedAt = uvRows[0]?.last_viewed_at || null;
  renderJobs();
}

async function loadSites() {
  const resp = await supaFetch('/rest/v1/sites?select=name,url,source,last_scraped,last_status,job_count&order=name.asc&limit=1000');
  sites = await resp.json();
  renderStats();
}

async function markViewed() {
  // Anchored to absolute time (now minus the grace window), not to when any
  // one tab/session started — a job stays NEW for ~2 min after being found,
  // consistently across however many tabs/devices you have open. Anchoring
  // to "session start" instead would let one tab's refresh reset the clock
  // for every other tab/device sharing this same row.
  //
  // A plain update, not an upsert: the row always exists (created during setup),
  // and RLS only grants this role UPDATE on ui_state, not INSERT — a
  // merge-duplicates POST silently fails here even though the row is already there.
  const cutoff = new Date(Date.now() - NEW_BADGE_GRACE_MS).toISOString();
  const resp = await supaFetch('/rest/v1/ui_state?id=eq.1', {
    method: 'PATCH',
    body: JSON.stringify({ last_viewed_at: cutoff }),
  });
  if (!resp.ok) {
    console.warn('mark-viewed failed:', resp.status, await resp.text());
  }
}

async function refreshAll() {
  await Promise.all([loadJobs(), loadSites()]);
  document.getElementById('lastRefreshed').textContent = 'Last refreshed: ' + new Date().toLocaleTimeString();
  try {
    await markViewed();
  } catch {
    // supaFetch already switched to the login screen if the session expired
  }
}

let autoRefreshTimer = null;
function scheduleAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  if (document.getElementById('autoRefresh').checked) {
    autoRefreshTimer = setInterval(refreshAll, 60000);
  }
}

document.getElementById('refreshBtn').onclick = refreshAll;
document.getElementById('autoRefresh').onchange = scheduleAutoRefresh;
document.getElementById('searchBox').oninput = renderJobs;
document.getElementById('categoryFilter').onchange = renderJobs;
document.getElementById('timeFilter').onchange = renderJobs;
document.getElementById('sortBy').onchange = renderJobs;

document.getElementById('logoutBtn').onclick = () => {
  clearTokens();
  showLogin();
};

document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  document.getElementById('loginError').textContent = '';
  try {
    await login(email, password);
    showDashboard();
    await refreshAll();
    scheduleAutoRefresh();
  } catch (err) {
    document.getElementById('loginError').textContent = err.message || 'Login failed';
  }
};

// -- boot --

(async function init() {
  const { access } = getTokens();
  if (!access) {
    showLogin();
    return;
  }
  try {
    showDashboard();
    await refreshAll();
    scheduleAutoRefresh();
  } catch {
    // supaFetch already switched to the login screen on auth failure
  }
})();
</script>
</body>
</html>
