name: Job Scraper Daily Run

on:
  schedule:
    # 11:00 AM Israel time (IST = UTC+2, or UTC+3 during summer)
    # Israel uses summer time roughly Mar-Oct, so:
    # Winter (Nov-Feb): 11:00 IST = 09:00 UTC
    # Summer (Mar-Oct): 11:00 IDT = 08:00 UTC
    # We'll use 08:00 UTC to cover summer, meaning in winter it runs at 10:00 IST
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore seen_jobs cache
        uses: actions/cache@v4
        with:
          path: |
            seen_jobs.json
            last_cleanup.json
            cv_skills.json
          key: scraper-data-${{ github.run_number }}
          restore-keys: |
            scraper-data-

      - name: Run scraper
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python job_scraper_github.py

      - name: Save seen_jobs for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_jobs.json
            last_cleanup.json
            cv_skills.json
          key: scraper-data-${{ github.run_number }}
